<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área Administrativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fas fa-shield-alt fa-3x mb-3"></i>
                        <h3>Área Administrativa</h3>
                        <p class="mb-0">83º Grupo Escoteiro Olave Saint Clair</p>
                    </div>
                    <div class="p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Senha de Acesso</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100 btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Entrar
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-muted">
                                <i class="fas fa-arrow-left me-1"></i>Voltar ao Site
                            </a>
                        </div>
                        
                        <!-- Área de Cadastro de Senha (só aparece se não houver senha) -->
                        <div id="setupArea" style="display: none;">
                            <hr>
                            <h5 class="text-center mb-3">Primeira Configuração</h5>
                            <form id="setupForm">
                                <div class="mb-3">
                                    <label class="form-label">Criar Senha de Administrador</label>
                                    <input type="password" class="form-control" id="newPassword" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Confirmar Senha</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="fas fa-key me-2"></i>Criar Senha
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Verificar se já existe senha configurada
        document.addEventListener('DOMContentLoaded', function() {
            const adminPassword = localStorage.getItem('adminPassword');
            if (!adminPassword) {
                document.getElementById('setupArea').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
            }
        });

        // Configurar senha inicial
        document.getElementById('setupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('As senhas não coincidem!');
                return;
            }
            
            if (newPassword.length < 4) {
                alert('A senha deve ter pelo menos 4 caracteres!');
                return;
            }
            
            // Salvar senha (hash simples)
            const hashedPassword = btoa(newPassword); // Base64 encoding
            localStorage.setItem('adminPassword', hashedPassword);
            
            alert('Senha criada com sucesso!');
            location.reload();
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const storedPassword = localStorage.getItem('adminPassword');
            
            if (btoa(password) === storedPassword) {
                // Login bem-sucedido
                sessionStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Senha incorreta!');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
