<head>
  <meta charset="utf-8">
  <title>83º Grupo Escoteiro Olave Saint Clair</title>
  <base href="/site_geosc/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="styles-5INURTSO.css"></head>
<body style="background-color: #f5f5f5;">
  <style>
    .hero-section {
      background: linear-gradient(rgba(220, 53, 69, 0.8), rgba(200, 35, 51, 0.8)), url('GrupoGrande.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      padding: 100px 0;
      min-height: 80vh;
      display: flex;
      align-items: center;
    }
    .section-padding {
      padding: 80px 0;
    }
  </style>
  <app-root></app-root>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Recarregar fotos e documentos quando voltar do admin
    window.addEventListener('focus', function() {
      // Disparar evento para Angular recarregar
      window.dispatchEvent(new CustomEvent('reloadPhotos'));
      window.dispatchEvent(new CustomEvent('reloadDocuments'));
    });
    
    // Smooth scrolling
    setTimeout(() => {
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });
    }, 1000);
  </script>
<script src="polyfills-5CFQRCPP.js" type="module"></script><script src="main-PM4D55OE.js" type="module"></script></body>
